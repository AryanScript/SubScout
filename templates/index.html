<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubScout Receipts</title>

  <!-- Bootstrap, only used for the container and flex layout helpers -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your CSS (Flask: static/style.css) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- Scroll animation styles -->
  <style>
    /* Remove the emerald glow/grid from style.css so the background stays neutral */
    body {
      background-image: none;
      background-color: #121214;
    }

    /* Background layers (sit behind everything) */
    .bg-layer {
      position: fixed;
      inset: -30% 0;
      z-index: -1;
      pointer-events: none;
      will-change: transform;
    }

    /* Your mailbox photo: pure black and white, transparent, moves as you scroll */
    .bg-photo {
      background-image: url("{{ url_for('static', filename='mail-bg.jpg') }}");
      background-size: cover;
      background-position: center;
      opacity: 0.30;                 /* 0.15 = faint, 0.45 = strong */
      filter: grayscale(1) contrast(1.1);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
    }

    /* Soft dark shade so card text stays readable (no colour) */
    .bg-shade {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.15), rgba(18, 18, 20, 0.55));
    }

    /* Neutral grid that drifts as you scroll */
    .bg-grid {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 90px 90px;
    }

    /* Neutral radar rings that move at a different speed */
    .bg-radar {
      background:
        radial-gradient(circle at 85% 35%, rgba(255, 255, 255, 0.08) 0, transparent 30%),
        repeating-radial-gradient(circle at 85% 35%,
          transparent 0 70px, rgba(255, 255, 255, 0.05) 71px 72px);
    }

    /* Reveal wrapper: animates in, so the card's own hover effect stays intact */
    .reveal {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .bg-layer { transform: none !important; }
    }
  </style>
</head>
<body>

  <!-- Background layers: lower data-speed = slower, feels farther away -->
  <div class="bg-layer bg-photo" data-speed="0.12"></div>
  <div class="bg-layer bg-shade" data-speed="0.12"></div>
  <div class="bg-layer bg-grid"  data-speed="0.20"></div>
  <div class="bg-layer bg-radar" data-speed="0.35"></div>

  <div class="container" style="max-width: 800px;">

    <h1 class="dashboard-title">SubScout: Recent Receipts</h1>
    <p class="text-secondary mb-4">Your latest subscription emails, at a glance.</p>

    {% for email in emails %}
    <div class="reveal" data-delay="{{ (loop.index0 % 4) * 80 }}" style="transition-delay: 0ms;">
      <div class="receipt-card">
        <div class="d-flex justify-content-between align-items-start gap-3">
          <div>
            <h2 class="receipt-title">{{ email.subject }}</h2>
            <div class="receipt-sender">From: {{ email.sender }}</div>
          </div>
          <span class="price-tag">{{ email.price }}</span>
        </div>

        <p class="receipt-snippet mb-0">{{ email.snippet }}</p>
      </div>
    </div>
    {% else %}
    <div class="reveal">
      <div class="receipt-card text-center">
        <p class="receipt-title">No receipts found!</p>
      </div>
    </div>
    {% endfor %}

  </div>

  <script>
    // 1) Parallax: background layers move at different speeds while scrolling
    const layers = document.querySelectorAll('.bg-layer');
    let ticking = false;

    function updateParallax() {
      const y = window.scrollY;
      layers.forEach(layer => {
        const speed = parseFloat(layer.dataset.speed) || 0.2;
        layer.style.transform = `translateY(${-y * speed}px)`;
      });
      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateParallax);
        ticking = true;
      }
    }, { passive: true });
    updateParallax();

    // 2) Reveal: cards slide up when they enter the viewport
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target); // animate once
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

</body>
</html>
